<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>LoveLevels - Juego de Citas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
  :root {
    --bg-deep: #020617;
    --bg-app: #0f172a;
    --bg-card: #1e293b;
    --border: #334155;
    --amber: #f59e0b;
    --amber-light: #fbbf24;
    --pink: #ec4899;
    --emerald: #34d399;
    --red: #f87171;
    --text: #f8fafc;
    --text-dim: #94a3b8;
    --text-dimmer: #64748b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg-deep); font-family: -apple-system, system-ui, sans-serif; }
  #root { height: 100%; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg-card); }
  ::-webkit-scrollbar-thumb { background: var(--amber); border-radius: 8px; }

  .app-shell { height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; background: var(--bg-deep); }
  .phone { width: 100%; max-width: 460px; height: 100%; background: var(--bg-app); display: flex; flex-direction: column; position: relative; overflow: hidden; }
  @media (min-width: 640px) { .phone { height: 90vh; border-radius: 32px; box-shadow: 0 0 60px rgba(0,0,0,.7); } }

  /* Login & Register */
  .login-screen { height: 100%; background: linear-gradient(to bottom, #0f172a, #1e293b); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; color: var(--text); overflow-y: auto; }
  .login-inner { width: 100%; max-width: 360px; }
  .login-title { font-size: 42px; font-weight: 800; text-align: center; margin: 0; background: linear-gradient(to right, var(--amber-light), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .login-sub { text-align: center; color: var(--text-dim); margin-top: 10px; font-size: 14px; line-height: 1.5; }
  .field { width: 100%; padding: 15px; border-radius: 14px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text); font-size: 15px; margin-top: 14px; outline: none; }
  .field:focus { border-color: var(--amber); }
  .field-error { font-size: 12px; color: var(--red); margin: 4px 2px 0; }
  .field-note { font-size: 11px; color: var(--text-dimmer); margin: 4px 2px 0; }
  .field-label { display: block; font-size: 12px; color: var(--text-dim); margin-top: 14px; margin-bottom: -6px; }
  .form-row { display: flex; gap: 10px; }
  .checkbox-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; font-size: 12px; color: var(--text-dim); line-height: 1.4; }
  .checkbox-row input { margin-top: 2px; flex-shrink: 0; width: 16px; height: 16px; }
  .btn-primary { width: 100%; padding: 15px; border-radius: 14px; border: none; margin-top: 20px; background: linear-gradient(to right, var(--amber), var(--amber-light)); color: #1e293b; font-weight: 700; font-size: 16px; box-shadow: 0 10px 25px rgba(245,158,11,.25); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-outline { width: 100%; padding: 13px; border-radius: 14px; margin-top: 22px; background: transparent; border: 1px solid #475569; color: #cbd5e1; font-size: 14px; }
  .switch-line { text-align: center; font-size: 13px; color: var(--text-dim); margin-top: 18px; }
  .link-btn { background: none; border: none; color: var(--amber-light); font-weight: 600; margin-left: 4px; padding: 0; font-size: 13px; }
  .divider-row { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
  .divider-row hr { flex: 1; border: none; border-top: 1px solid var(--border); }
  .divider-row span { font-size: 11px; color: var(--text-dimmer); white-space: nowrap; }

  /* Swipe */
  .swipe-screen { display: flex; flex-direction: column; height: 100%; padding: 16px; padding-top: 22px; }
  .swipe-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 8px; }
  .swipe-header h2 { color: var(--text); font-size: 20px; font-weight: 700; margin: 0; }
  .pill { color: var(--amber-light); font-size: 12px; border: 1px solid rgba(245,158,11,.3); padding: 5px 12px; border-radius: 999px; }
  .match-banner { margin-bottom: 10px; text-align: center; font-size: 13px; background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.35); color: var(--emerald); border-radius: 12px; padding: 9px; }
  .swipe-area { flex: 1; position: relative; user-select: none; }
  .swipe-card { position: absolute; inset: 0; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,.5); border: 1px solid var(--border); touch-action: none; }
  .avatar-fill { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #1e293b; font-size: 96px; }
  .card-info { position: absolute; left: 0; right: 0; bottom: 0; padding: 24px; background: linear-gradient(to top, rgba(0,0,0,.9), rgba(0,0,0,.5), transparent); }
  .card-info h3 { color: var(--text); font-size: 24px; font-weight: 700; margin: 0; }
  .card-info .city { color: #cbd5e1; margin: 2px 0 0; }
  .card-info .bio { color: #e2e8f0; margin-top: 8px; font-size: 14px; }
  .swipe-overlay { position: absolute; top: 32px; padding: 6px 16px; border-radius: 10px; font-weight: 800; font-size: 22px; letter-spacing: 2px; }
  .swipe-overlay.like { left: 24px; color: var(--emerald); border: 3px solid var(--emerald); transform: rotate(-12deg); }
  .swipe-overlay.nope { right: 24px; color: var(--red); border: 3px solid var(--red); transform: rotate(12deg); }
  .swipe-actions { position: absolute; bottom: 24px; left: 0; right: 0; display: flex; justify-content: center; gap: 32px; }
  .round-btn { width: 62px; height: 62px; border-radius: 50%; background: var(--bg-card); display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 10px 25px rgba(0,0,0,.4); border: 2px solid; }
  .round-btn.no { border-color: rgba(248,113,113,.5); color: var(--red); }
  .round-btn.yes { border-color: rgba(52,211,153,.5); color: var(--emerald); }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 24px; color: var(--text); }
  .empty-state .icon { font-size: 48px; margin-bottom: 14px; }
  .empty-state h2 { margin: 0; font-size: 21px; }
  .empty-state p { color: var(--text-dim); margin-top: 8px; font-size: 14px; }
  .btn-reload { margin-top: 22px; padding: 12px 22px; background: var(--amber); border: none; border-radius: 14px; font-weight: 700; color: #1e293b; }

  /* Progress */
  .progress-screen { display: flex; flex-direction: column; height: 100%; padding: 16px; padding-top: 22px; color: var(--text); overflow-y: auto; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; padding: 0 8px; }
  .progress-header h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .match-chip { background: var(--bg-card); padding: 5px 12px; border-radius: 999px; font-size: 11px; border: 1px solid rgba(245,158,11,.3); display: flex; align-items: center; gap: 5px; }
  .xp-card { background: rgba(30,41,59,.5); border-radius: 24px; padding: 22px; border: 1px solid var(--border); margin-bottom: 22px; }
  .xp-row { display: flex; justify-content: space-between; font-size: 13px; color: #9ca3af; margin-bottom: 5px; }
  .xp-track { width: 100%; background: #334155; height: 15px; border-radius: 999px; overflow: hidden; }
  .xp-fill { height: 100%; background: linear-gradient(to right, #facc15, #f97316); transition: width .7s ease-out; }
  .levels-row { display: flex; justify-content: space-between; margin-top: 18px; padding: 0 4px; position: relative; }
  .level-node { display: flex; flex-direction: column; align-items: center; z-index: 1; }
  .level-circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid; font-size: 14px; background: rgba(51,65,85,.5); border-color: #475569; color: #64748b; }
  .level-circle.unlocked { background: rgba(52,211,153,.2); border-color: var(--emerald); color: var(--emerald); }
  .level-circle.current { box-shadow: 0 0 0 4px rgba(250,204,21,.35); transform: scale(1.1); }
  .level-node span { font-size: 11px; margin-top: 5px; color: #64748b; }
  .level-node.unlocked span { color: var(--text); }
  .levels-track { position: absolute; top: 20px; left: 15%; width: 70%; height: 2px; background: #334155; z-index: 0; }
  .levels-track-fill { height: 100%; background: rgba(52,211,153,.5); }
  .btn-levelup { width: 100%; padding: 16px; border-radius: 18px; font-weight: 700; font-size: 16px; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(to right, var(--amber), var(--amber-light)); color: #1e293b; box-shadow: 0 12px 25px rgba(245,158,11,.3); }
  .btn-levelup:disabled { background: #334155; color: #64748b; box-shadow: none; }
  .hint-box { text-align: center; font-size: 13px; color: #9ca3af; background: rgba(30,41,59,.3); padding: 12px; border-radius: 14px; border: 1px solid rgba(51,65,85,.5); margin-top: 16px; }
  .hint-box .accepted { color: var(--emerald); }

  /* Questions & Reveal */
  .questions-screen { display: flex; flex-direction: column; height: 100%; padding: 24px; color: var(--text); }
  .questions-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .questions-header h2 { font-size: 20px; font-weight: 700; margin: 0; }
  .questions-header button { background: none; border: none; color: var(--text-dim); font-size: 14px; }
  .progress-bar { background: #334155; height: 4px; border-radius: 2px; margin-bottom: 24px; }
  .progress-bar-fill { height: 100%; background: var(--amber); border-radius: 2px; transition: width .3s; }
  .q-card { background: rgba(30,41,59,.5); border-radius: 24px; padding: 28px; border: 1px solid var(--border); flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .q-card .q-number { font-size: 12px; color: var(--amber-light); margin-bottom: 6px; }
  .q-card .q-text { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
  .q-card input { width: 100%; padding: 16px; border-radius: 14px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text); font-size: 15px; outline: none; }
  .q-card input:focus { border-color: var(--amber); }
  .q-card .btn-next { margin-top: 16px; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(to right, var(--amber), var(--amber-light)); color: #1e293b; font-weight: 700; font-size: 16px; }

  .reveal-screen { display: flex; flex-direction: column; height: 100%; padding: 24px; color: var(--text); overflow-y: auto; }
  .reveal-screen h2 { text-align: center; font-size: 22px; margin: 0 0 4px; }
  .reveal-sub { text-align: center; color: var(--text-dim); font-size: 14px; margin-bottom: 20px; }
  .reveal-item { background: rgba(30,41,59,.5); border-radius: 16px; padding: 16px; border: 1px solid var(--border); margin-bottom: 14px; }
  .reveal-item .q { font-size: 12px; color: var(--amber-light); margin-bottom: 6px; }
  .reveal-item .answers { display: flex; gap: 20px; font-size: 14px; flex-wrap: wrap; }
  .reveal-item .answers .mine { color: var(--text-dim); }
  .reveal-item .answers .theirs { color: var(--emerald); }
  .btn-continue { margin-top: 20px; padding: 16px; border-radius: 18px; border: none; background: linear-gradient(to right, var(--amber), var(--amber-light)); color: #1e293b; font-weight: 700; font-size: 16px; box-shadow: 0 10px 25px rgba(245,158,11,.3); }

  /* Chat */
  .chat-screen { display: flex; flex-direction: column; height: 100%; background: var(--bg-app); }
  .chat-header { padding: 14px 16px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
  .chat-header-left { display: flex; align-items: center; gap: 12px; }
  .avatar-round { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #1e293b; }
  .chat-header-left .name { color: var(--text); font-weight: 600; margin: 0; font-size: 15px; }
  .chat-header-left .lvl { color: var(--amber-light); font-size: 11px; margin: 2px 0 0; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-card); border: 1px solid; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .icon-btn.amber { color: var(--amber-light); border-color: rgba(245,158,11,.3); }
  .icon-btn.emerald { color: var(--emerald); border-color: rgba(52,211,153,.3); }
  .match-strip { display: flex; gap: 10px; padding: 10px 16px 4px; overflow-x: auto; border-bottom: 1px solid #1e293b; }
  .match-strip::-webkit-scrollbar { height: 0; }
  .match-pill { flex-shrink: 0; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #1e293b; border: 2px solid transparent; }
  .match-pill.active { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,.25); }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg-row { display: flex; }
  .msg-row.me { justify-content: flex-end; }
  .msg-row.them { justify-content: flex-start; }
  .bubble { max-width: 78%; padding: 11px 14px; border-radius: 18px; font-size: 14px; }
  .bubble.me { background: var(--amber); color: #1e293b; border-bottom-right-radius: 4px; }
  .bubble.them { background: var(--bg-card); color: var(--text); border-bottom-left-radius: 4px; }
  .bubble time { display: block; text-align: right; font-size: 10px; opacity: .55; margin-top: 4px; }
  
  /* System message */
  .system-msg { text-align: center; padding: 10px 16px; margin: 8px 0; font-size: 12px; color: var(--amber-light); background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.2); border-radius: 12px; line-height: 1.5; }
  .system-msg .sys-icon { font-size: 18px; display: block; margin-bottom: 4px; }
  .system-msg.level-up { background: linear-gradient(to right, rgba(52,211,153,.1), rgba(245,158,11,.1)); border-color: rgba(52,211,153,.3); color: var(--emerald); }

  /* Poll Styles */
  .poll-container { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .poll-btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.6); color: var(--text); font-size: 14px; font-weight: 600; text-align: left; transition: all 0.2s; }
  .poll-btn:hover:not(:disabled) { background: rgba(245, 158, 11, 0.15); border-color: var(--amber); }
  .poll-btn:disabled { cursor: default; opacity: 0.8; }
  .poll-btn.voted { background: rgba(52, 211, 153, 0.15); border-color: var(--emerald); color: var(--emerald); }
  .poll-btn.match { background: rgba(52, 211, 153, 0.25); border-color: var(--emerald); color: var(--emerald); font-weight: 700; }

  .chat-empty { text-align: center; color: #64748b; margin-top: 70px; }
  .chat-empty .icon { font-size: 34px; margin-bottom: 8px; }
  .chat-input-row { padding: 14px; border-top: 1px solid #1e293b; display: flex; align-items: center; gap: 8px; }
  .chat-input { flex: 1; padding: 12px 16px; border-radius: 999px; background: var(--bg-card); color: var(--text); border: 1px solid var(--border); outline: none; font-size: 14px; }
  .chat-input:focus { border-color: var(--amber); }
  .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--amber); border: none; color: #1e293b; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .round-btn-sm { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-card); border: none; font-size: 18px; color: var(--text); display: flex; align-items: center; justify-content: center; }
  .round-btn-sm.poll-btn-trigger { color: var(--pink); border: 1px solid rgba(236, 72, 153, 0.3); }
  
  /* Pulse animation for new unlocked buttons */
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
    50% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
  }
  .pulse-new { animation: pulse-glow 1.5s infinite; background: rgba(245, 158, 11, 0.15) !important; border-color: var(--amber) !important; }

  /* Level Up Overlay */
  .levelup-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(245,158,11,.25), rgba(2,6,23,.95));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.4s ease-out;
    backdrop-filter: blur(8px);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    0% { transform: scale(0.3) rotate(-180deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(10deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .levelup-icon {
    font-size: 90px;
    animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    margin-bottom: 16px;
    filter: drop-shadow(0 0 30px rgba(245, 158, 11, 0.6));
  }
  .levelup-title {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(to right, var(--amber-light), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0 0 8px;
    animation: slideUp 0.6s ease-out 0.3s both;
    text-align: center;
    padding: 0 20px;
  }
  .levelup-subtitle {
    font-size: 15px;
    color: var(--text);
    margin: 0 0 24px;
    text-align: center;
    padding: 0 24px;
    line-height: 1.5;
    animation: slideUp 0.6s ease-out 0.5s both;
  }
  .levelup-feature {
    display: inline-block;
    padding: 10px 20px;
    background: rgba(52, 211, 153, 0.15);
    border: 1px solid rgba(52, 211, 153, 0.4);
    color: var(--emerald);
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    animation: slideUp 0.6s ease-out 0.7s both;
  }
  .levelup-dismiss {
    margin-top: 32px;
    padding: 12px 32px;
    background: var(--amber);
    border: none;
    border-radius: 14px;
    color: #1e293b;
    font-weight: 700;
    font-size: 15px;
    animation: slideUp 0.6s ease-out 0.9s both;
  }

  /* Profile */
  .profile-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 24px; color: var(--text); text-align: center; overflow-y: auto; }
  .profile-avatar { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(to right, var(--amber-light), var(--pink)); display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 700; color: #1e293b; margin-bottom: 16px; }
  .profile-screen h2 { margin: 0; font-size: 22px; }
  .profile-screen .email { color: var(--text-dim); margin-top: 4px; }
  .profile-stats { margin-top: 32px; width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 14px; }
  .stat-row { display: flex; justify-content: space-between; padding: 12px 14px; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border); font-size: 14px; }
  .stat-row .val-amber { color: var(--amber-light); font-weight: 700; }
  .stat-row .val-emerald { color: var(--emerald); font-weight: 700; }
  .btn-premium { width: 100%; padding: 13px; border-radius: 14px; border: 1px solid; background: transparent; font-weight: 700; font-size: 14px; }
  .btn-premium.active { border-color: rgba(52,211,153,.4); color: var(--emerald); }
  .btn-premium.inactive { border-color: rgba(245,158,11,.4); color: var(--amber-light); }
  .btn-logout { width: 100%; padding: 13px; background: rgba(248,113,113,.15); border: 1px solid rgba(248,113,113,.3); border-radius: 14px; color: var(--red); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }

  /* Nav */
  .bottom-nav { background: var(--bg-app); border-top: 1px solid #1e293b; display: flex; justify-content: space-around; padding: 12px 0 20px; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; color: #475569; }
  .nav-btn.active { color: var(--amber-light); }
  .nav-btn .nav-icon { font-size: 21px; line-height: 1; }
  .nav-btn .nav-label { font-size: 10px; font-weight: 500; }

  .toast { position: absolute; top: 16px; right: 16px; background: var(--emerald); color: #fff; font-size: 12px; padding: 7px 14px; border-radius: 999px; box-shadow: 0 8px 20px rgba(52,211,153,.5); z-index: 10; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// --------------------------------------------------------------
// DATOS MOCK
// --------------------------------------------------------------

function Avatar({ user, className, style }) {
  return (
    <div className={className || 'avatar-fill'} style={{ background: user.gradient, ...style }}>
      {user.name.charAt(0)}
    </div>
  );
}

function calculateAge(dobString) {
  if (!dobString) return null;
  const dob = new Date(dobString);
  if (isNaN(dob.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
  return age;
}

function nowTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// LEVEL UP OVERLAY (Pantalla épica de desbloqueo)
// --------------------------------------------------------------
function LevelUpOverlay({ level, onClose }) {
  const levelData = LEVELS.find(l => l.id === level);
  
  useEffect(() => {
    // Lanzar confeti múltiple
    if (typeof confetti === 'function') {
      const duration = 2500;
      const end = Date.now() + duration;
      
      const frame = () => {
        confetti({
          particleCount: 3,
          angle: 60,
          spread: 55,
          origin: { x: 0, y: 0.7 },
          colors: ['#fbbf24', '#ec4899', '#34d399']
        });
        confetti({
          particleCount: 3,
          angle: 120,
          spread: 55,
          origin: { x: 1, y: 0.7 },
          colors: ['#fbbf24', '#ec4899', '#34d399']
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      };
      frame();
      
      // Explosión central grande
      setTimeout(() => {
        confetti({
          particleCount: 100,
          spread: 100,
          origin: { y: 0.5 },
          colors: ['#fbbf24', '#ec4899', '#34d399', '#f87171']
        });
      }, 300);
    }
    
    // Vibración si está disponible
    if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
  }, []);

  return (
    <div className="levelup-overlay" onClick={onClose}>
      <div className="levelup-icon">{levelData?.icon || '🎉'}</div>
      <h2 className="levelup-title">¡Nivel {level} desbloqueado!</h2>
      <p className="levelup-subtitle">{levelData?.desc}</p>
      <div className="levelup-feature">✨ {levelData?.feature} activado</div>
      <button className="levelup-dismiss" onClick={(e) => { e.stopPropagation(); onClose(); }}>
        ¡Vamos a probarlo!
      </button>
    </div>
  );
}

function RegisterScreen({ onRegister, onBackToLogin }) {

  const [errors, setErrors] = useState({});
  const setField = (key, value) => setForm(prev => ({ ...prev, [key]: value }));
  const validate = () => {
    const errs = {};
    if (!form.nombre.trim()) errs.nombre = 'Ingresa tu nombre';
    if (!form.apellido.trim()) errs.apellido = 'Ingresa tu apellido';
    if (!form.alias.trim()) errs.alias = 'Elige un alias público';
    if (!form.fechaNacimiento) errs.fechaNacimiento = 'Ingresa tu fecha de nacimiento';
    else {
      const age = calculateAge(form.fechaNacimiento);
      if (age === null) errs.fechaNacimiento = 'Fecha inválida';
      else if (age < 18) errs.fechaNacimiento = 'Debes ser mayor de 18 años';
    }
    if (!form.genero) errs.genero = 'Selecciona tu género';
    if (!form.interesadoEn) errs.interesadoEn = 'Selecciona qué te interesa';
    if (!form.ciudad.trim()) errs.ciudad = 'Ingresa tu ciudad';
    if (!form.email.trim()) errs.email = 'Ingresa tu email';
    if (!form.password) errs.password = 'Ingresa una contraseña';
    else if (form.password.length < 6) errs.password = 'Mínimo 6 caracteres';
    if (form.confirmPassword !== form.password) errs.confirmPassword = 'Las contraseñas no coinciden';
    if (!form.aceptaTerminos) errs.aceptaTerminos = 'Debes aceptar los términos';
    return errs;
  };
  const handleSubmit = (e) => {
    e.preventDefault();
    const errs = validate();
    setErrors(errs);
    if (Object.keys(errs).length === 0) onRegister(form.email);
  };
  return (
    <div className="login-screen">
      <div className="login-inner">
        <h1 className="login-title" style={{ fontSize: 32 }}>Crear cuenta</h1>
        <p className="login-sub">Solo para mayores de 18 años. Completa tu perfil para empezar.</p>
        <form onSubmit={handleSubmit} noValidate>
          <div className="form-row">
            <div style={{ flex: 1 }}><input className="field" placeholder="Nombre" value={form.nombre} onChange={e => setField('nombre', e.target.value)} />{errors.nombre && <p className="field-error">{errors.nombre}</p>}</div>
            <div style={{ flex: 1 }}><input className="field" placeholder="Apellido" value={form.apellido} onChange={e => setField('apellido', e.target.value)} />{errors.apellido && <p className="field-error">{errors.apellido}</p>}</div>
          </div>
          <input className="field" placeholder="Alias (nombre público)" value={form.alias} onChange={e => setField('alias', e.target.value)} />
          {errors.alias && <p className="field-error">{errors.alias}</p>}
          <label className="field-label">Fecha de nacimiento</label>
          <input className="field" type="date" value={form.fechaNacimiento} onChange={e => setField('fechaNacimiento', e.target.value)} />
          {errors.fechaNacimiento && <p className="field-error">{errors.fechaNacimiento}</p>}
          <div className="form-row">
            <div style={{ flex: 1 }}>
              <select className="field" value={form.genero} onChange={e => setField('genero', e.target.value)}>
                <option value="">Género</option><option value="mujer">Mujer</option><option value="hombre">Hombre</option><option value="no_binario">No binario</option><option value="otro">Otro</option>
              </select>
              {errors.genero && <p className="field-error">{errors.genero}</p>}
            </div>
            <div style={{ flex: 1 }}>
              <select className="field" value={form.interesadoEn} onChange={e => setField('interesadoEn', e.target.value)}>
                <option value="">Busco</option><option value="mujeres">Mujeres</option><option value="hombres">Hombres</option><option value="todos">Todos</option>
              </select>
              {errors.interesadoEn && <p className="field-error">{errors.interesadoEn}</p>}

// --------------------------------------------------------------
// SWIPE
// --------------------------------------------------------------
function SwipeScreen({ onMatch, index, onIndexChange }) {
  const [isDragging, setIsDragging] = useState(false);
  const [startX, setStartX] = useState(0);
  const [offsetX, setOffsetX] = useState(0);
  const [lastResult, setLastResult] = useState(null);
  const currentUserData = MOCK_USERS[index];
  const remaining = MOCK_USERS.length - index;

  const handleSwipe = (direction) => {
    if (!currentUserData) return;
    if (direction === 'right') {
      const isMatch = Math.random() > 0.4;
      if (isMatch) {
        const added = onMatch(currentUserData);
        setLastResult(added ? { name: currentUserData.name } : null);
      } else { setLastResult(null); }
    } else { setLastResult(null); }
    onIndexChange(index + 1);
    setOffsetX(0);
  };

  const startDrag = (x) => { setIsDragging(true); setStartX(x); };
  const moveDrag = (x) => { if (isDragging) setOffsetX(x - startX); };
  const endDrag = () => {
    setIsDragging(false);
    if (offsetX > 80) handleSwipe('right');
    else if (offsetX < -80) handleSwipe('left');
    else setOffsetX(0);
  };

  if (!currentUserData) {
    return (
      <div className="empty-state">
        <div className="icon">👥</div>
        <h2>No hay más perfiles</h2>
        <p>Vuelve más tarde o amplía tu radio de búsqueda.</p>
        <button className="btn-reload" onClick={() => onIndexChange(0)}>Ver perfiles de nuevo</button>
      </div>
    );
  }

  const overlayOpacity = Math.min(Math.abs(offsetX) / 100, 1);

  return (
    <div className="swipe-screen">
      <div className="swipe-header">
        <h2>Descubrir</h2>
        <span className="pill">{remaining} perfiles</span>
      </div>
      {lastResult && <div className="match-banner">💖 ¡Match con {lastResult.name}! Responde preguntas para conectar.</div>}
      <div className="swipe-area">
        <div className="swipe-card" style={{ transform: `translateX(${offsetX}px) rotate(${offsetX * 0.05}deg)`, transition: isDragging ? 'none' : 'transform 0.3s' }}
          onTouchStart={e => startDrag(e.touches[0].clientX)} onTouchMove={e => moveDrag(e.touches[0].clientX)} onTouchEnd={endDrag}
          onMouseDown={e => startDrag(e.clientX)} onMouseMove={e => moveDrag(e.clientX)} onMouseUp={endDrag} onMouseLeave={() => isDragging && endDrag()}>
          <Avatar user={currentUserData} className="avatar-fill" />
          {Math.abs(offsetX) > 20 && <div className={`swipe-overlay ${offsetX > 0 ? 'like' : 'nope'}`} style={{ opacity: overlayOpacity }}>{offsetX > 0 ? 'LIKE' : 'NOPE'}</div>}
          <div className="card-info">
            <h3>{currentUserData.name}, {currentUserData.age}</h3>
            <p className="city">{currentUserData.city}</p>
            <p className="bio">{currentUserData.bio}</p>
          </div>
        </div>
        <div className="swipe-actions">
          <button className="round-btn no" aria-label="Descartar" onClick={() => handleSwipe('left')}>✕</button>
          <button className="round-btn yes" aria-label="Me gusta" onClick={() => handleSwipe('right')}>♥</button>
        </div>
      </div>
    </div>
  );
}

// QUESTIONS & REVEAL

function QuestionsScreen({ match, onComplete, onSkip }) {
  const [answers, setAnswers] = useState([]);
  const [currentIdx, setCurrentIdx] = useState(0);
  const [inputValue, setInputValue] = useState('');
  const inputRef = useRef(null);
  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, [currentIdx]);

  const handleNext = () => {
    const trimmed = inputValue.trim();
    if (!trimmed) return;
    const newAnswers = [...answers, trimmed];
    setAnswers(newAnswers);
    setInputValue('');
    if (currentIdx < QUESTIONS.length - 1) setCurrentIdx(currentIdx + 1);
    else onComplete(newAnswers);
  };

  return (
    <div className="questions-screen">
      <div className="questions-header"><h2>Conoce a {match.name}</h2><button onClick={onSkip}>Saltar</button></div>
      <div className="progress-bar"><div className="progress-bar-fill" style={{ width: `${(answers.length / QUESTIONS.length) * 100}%` }} /></div>
      <div className="q-card">
        <div className="q-number">Pregunta {currentIdx + 1} de {QUESTIONS.length}</div>
        <div className="q-text">{QUESTIONS[currentIdx]}</div>
        <input ref={inputRef} type="text" placeholder="Escribe tu respuesta..." value={inputValue} onChange={e => setInputValue(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleNext()} />
        <button className="btn-next" onClick={handleNext}>{currentIdx < QUESTIONS.length - 1 ? 'Siguiente →' : 'Completar →'}</button>
      </div>
    </div>
  );
}

function RevealScreen({ match, myAnswers, theirAnswers, onContinue }) {
  return (

function ChatScreen({ match, level, messages, onSend, onAudio, onPhoto, onShareContact, isPremium, onSendPoll, onVotePoll, justUnlockedFeature }) {
  const [input, setInput] = useState('');
  const messagesEndRef = useRef(null);
  useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

  const send = () => { if (!input.trim()) return; onSend(input); setInput(''); };

  return (
    <div className="chat-screen">
      <div className="chat-header">
        <div className="chat-header-left">
          <Avatar user={match} className="avatar-round" />
          <div><p className="name">{match.name}</p><p className="lvl">★ Nivel {level}</p></div>
        </div>
        <div className="header-actions">
          {level >= 2 && <button onClick={onAudio} className={`icon-btn amber ${justUnlockedFeature === 'voice' ? 'pulse-new' : ''}`} aria-label="Nota de voz">🎤</button>}
          {level >= 3 && <button onClick={onPhoto} className={`icon-btn emerald ${justUnlockedFeature === 'photo' ? 'pulse-new' : ''}`} aria-label="Compartir foto">📷</button>}
          {level >= 4 && isPremium && <button onClick={onShareContact} className={`icon-btn ${justUnlockedFeature === 'contact' ? 'pulse-new' : ''}`} aria-label="Compartir contacto" style={{ color: '#f472b6', borderColor: 'rgba(244,114,182,.3)' }}>📞</button>}
        </div>
      </div>
      <div className="messages">
        {messages.length === 0 && (
          <div className="chat-empty">
            <div className="icon">💬</div>
            <p>Empieza la conversación</p>
            <p style={{ fontSize: 12 }}>Nivel {level}: {level === 1 ? 'solo texto' : level === 2 ? 'texto y voz' : level === 3 ? 'texto, voz y fotos' : 'todo desbloqueado'}</p>
          </div>
        )}
        {messages.map(msg => {
          // MENSAJE DE SISTEMA
          if (msg.type === 'system') {
            return (
              <div key={msg.id} className={`system-msg ${msg.subtype === 'levelup' ? 'level-up' : ''}`}>
                <span className="sys-icon">{msg.icon}</span>
                {msg.text}
              </div>
            );
          }
          // POLL (ESTO O AQUELLO)
          if (msg.type === 'poll') {
            const hasVoted = msg.votedBy.includes('me');
            const matchHasVoted = msg.votedBy.includes('them');
            return (
              <div key={msg.id} className={`msg-row ${msg.from === 'me' ? 'me' : 'them'}`}>
                <div className={`bubble ${msg.from === 'me' ? 'me' : 'them'}`} style={{ maxWidth: '85%' }}>
                  <p style={{ margin: '0 0 8px 0', fontWeight: 600, fontSize: 13, color: 'var(--amber-light)' }}>🎲 ¿Esto o Aquello?</p>
                  <p style={{ margin: '0 0 12px 0', fontSize: 15, fontWeight: 500 }}>{msg.question}</p>
                  <div className="poll-container">
                    <button 
                      className={`poll-btn ${hasVoted && msg.myVote === 'A' ? 'voted' : ''} ${matchHasVoted && msg.matchVote === 'A' ? 'match' : ''}`}
                      disabled={hasVoted}
                      onClick={() => onVotePoll(msg.id, 'A')}
                    >
                      {msg.optionA} {matchHasVoted && msg.matchVote === 'A' ? ' ✅' : ''}
                    </button>
                    <button 
                      className={`poll-btn ${hasVoted && msg.myVote === 'B' ? 'voted' : ''} ${matchHasVoted && msg.matchVote === 'B' ? 'match' : ''}`}
                      disabled={hasVoted}
                      onClick={() => onVotePoll(msg.id, 'B')}
                    >
                      {msg.optionB} {matchHasVoted && msg.matchVote === 'B' ? ' ✅' : ''}
                    </button>
                  </div>
                  <time>{msg.time}</time>
                </div>
              </div>
            );
          }
          // MENSAJE NORMAL
          return (
            <div key={msg.id} className={`msg-row ${msg.from}`}>
              <div className={`bubble ${msg.from}`}>
                {msg.isAudio && '🎤 '}{msg.isPhoto && '📷 '}{msg.isContact && '📞 '}
                <p style={{ margin: 0 }}>{msg.text}</p>
                <time>{msg.time}</time>
              </div>
            </div>
          );
        })}
        <div ref={messagesEndRef} />
      </div>
      <div className="chat-input-row">
        <button onClick={onSendPoll} className="round-btn-sm poll-btn-trigger" aria-label="Jugar Esto o Aquello" title="Jugar Esto o Aquello (+XP)">🎲</button>
        {level >= 2 && <button onClick={onAudio} className={`round-btn-sm ${justUnlockedFeature === 'voice' ? 'pulse-new' : ''}`} aria-label="Nota de voz">🎤</button>}
        {level >= 3 && <button onClick={onPhoto} className={`round-btn-sm ${justUnlockedFeature === 'photo' ? 'pulse-new' : ''}`} aria-label="Compartir foto">📷</button>}
        <input className="chat-input" type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} placeholder="Escribe un mensaje..." aria-label="Mensaje" />
        <button className="send-btn" aria-label="Enviar" onClick={send}>➤</button>
      </div>
    </div>
  );
}

function ProgressScreen({ match, level, xp, hasAccepted, onProposeLevelUp, isPremium }) {
  if (!match) return (<div className="empty-state"><div className="icon">⚡</div><h2>Todavía no tienes un match</h2><p>Desliza a la derecha en Descubrir.</p></div>);
  const currentLevel = LEVELS.find(l => l.id === level);
  const nextLevel = LEVELS.find(l => l.id === level + 1);
  const progress = () => {
    if (!nextLevel) return 100;
    const inLevel = xp - (currentLevel ? currentLevel.xpReq : 0);
    const needed = nextLevel.xpReq - (currentLevel ? currentLevel.xpReq : 0);
    return Math.min((inLevel / needed) * 100, 100);
  };
  const canLevelUp = !!nextLevel && xp >= nextLevel.xpReq && !hasAccepted;
  const missingXp = nextLevel ? Math.max(nextLevel.xpReq - xp, 0) : 0;

  return (
    <div className="progress-screen">
      <div className="progress-header"><h2>Mi progreso</h2><div className="match-chip"><span>⚡</span><span>Match: {match.name}</span></div></div>
      <div className="xp-card">
        <div className="xp-row"><span>Experiencia (XP)</span><span>{xp} / {nextLevel ? nextLevel.xpReq : 'MAX'}</span></div>
        <div className="xp-track"><div className="xp-fill" style={{ width: `${progress()}%` }} /></div>
        <div className="levels-row">
          <div className="levels-track"><div className="levels-track-fill" style={{ width: `${((level - 1) / (LEVELS.length - 1)) * 100}%` }} /></div>
          {LEVELS.map(lvl => {
            const unlocked = level >= lvl.id;
            const isCurrent = level === lvl.id;
            const isLockedPremium = !!lvl.premium && !isPremium;
            return (
              <div key={lvl.id} className={`level-node ${unlocked ? 'unlocked' : ''}`}>
                <div className={`level-circle ${unlocked ? 'unlocked' : ''} ${isCurrent ? 'current' : ''}`}>{isLockedPremium ? '⭐' : unlocked ? '✓' : '🔒'}</div>
                <span>{lvl.name}{lvl.premium && ' (P)'}</span>
              </div>
            );
          })}
        </div>
      </div>
      {nextLevel ? (
        <>
          <button className="btn-levelup" disabled={!canLevelUp} onClick={onProposeLevelUp}>
            {hasAccepted ? '⏳ Esperando confirmación...' : canLevelUp ? `⬆️ Subir a Nivel ${nextLevel.id}` : `🔒 Faltan ${missingXp} XP para Nivel ${nextLevel.id}`}
          </button>
          <div className="hint-box">{hasAccepted ? <span className="accepted">★ Aceptaste. Esperando a {match.name}.</span> : <span>📌 Ambos deben aceptar para subir. Gana XP chateando o jugando 🎲.</span>}</div>
        </>
      ) : (
        <div className="hint-box" style={{ color: 'var(--emerald)', borderColor: 'rgba(52,211,153,.4)' }}>🎉 ¡Nivel máximo alcanzado! {isPremium ? 'Puedes compartir tu teléfono.' : 'Activa Premium para compartir tu teléfono.'}</div>
      )}
    </div>
  );
}

function ProfileScreen({ email, matchCount, level, onLogout, isPremium, onTogglePremium }) {
  return (
    <div className="profile-screen">
      <div className="profile-avatar">{email.charAt(0).toUpperCase()}</div>
      <h2>Usuario Demo</h2>
      <p className="email">{email}</p>
      <div className="profile-stats">
        <div className="stat-row"><span>Nivel actual</span><span className="val-amber">Nivel {level}</span></div>
        <div className="stat-row"><span>Matches</span><span className="val-emerald">{matchCount}</span></div>
        <button className={`btn-premium ${isPremium ? 'active' : 'inactive'}`} onClick={onTogglePremium}>{isPremium ? '⭐ Premium activado' : '⭐ Activar Premium (demo)'}</button>
        <button className="btn-logout" onClick={onLogout}>⎋ Cerrar sesión</button>
      </div>
    </div>
  );
}

// --------------------------------------------------------------
// APP (LÓGICA PRINCIPAL CON LEVEL-UP ÉPICO)
// --------------------------------------------------------------
function App() {
  const [email, setEmail] = useState(null);
  const [activeTab, setActiveTab] = useState('swipe');
  const [swipeIndex, setSwipeIndex] = useState(0);
  const [chats, setChats] = useState({});
  const [currentMatchId, setCurrentMatchId] = useState(null);
  const [toast, setToast] = useState(null);
  const [isPremium, setIsPremium] = useState(false);
  const [levelUpOverlay, setLevelUpOverlay] = useState(null); // { level, matchId }
  const [justUnlockedFeature, setJustUnlockedFeature] = useState(null); // 'voice' | 'photo' | 'contact'

  const currentChat = currentMatchId ? chats[currentMatchId] : null;
  const matchIds = Object.keys(chats);

  const showToast = (msg, duration = 2200) => { setToast(msg); setTimeout(() => setToast(null), duration); };
  const updateChat = (id, patch) => {
    setChats(prev => {
      const cur = prev[id];
      if (!cur) return prev;
      const next = typeof patch === 'function' ? patch(cur) : patch;
      return { ...prev, [id]: { ...cur, ...next } };
    });
  };

  const handleLogin = (mail) => setEmail(mail);
  const handleLogout = () => { setEmail(null); setActiveTab('swipe'); setSwipeIndex(0); setChats({}); setCurrentMatchId(null); setIsPremium(false); setToast(null); setLevelUpOverlay(null); setJustUnlockedFeature(null); };

  const handleMatch = (user) => {
    if (chats[user.id]) return false;
    setChats(prev => ({
      ...prev, [user.id]: { match: user, level: 1, xp: 45, messages: [], phase: 'questions', myAnswers: [], theirAnswers: user.answers || [], hasAccepted: false }
    }));
    setCurrentMatchId(user.id);
    setActiveTab('chat');
    return true;
  };

  const handleQuestionsComplete = (answers) => { if (!currentMatchId) return; updateChat(currentMatchId, { myAnswers: answers, phase: 'reveal' }); showToast('✨ Respuestas reveladas', 2000); };
  const handleQuestionsSkip = () => { if (!currentMatchId) return; updateChat(currentMatchId, { phase: 'chat' }); showToast('Preguntas saltadas', 1500); };
  const handleRevealContinue = () => {
    if (!currentMatchId) return;
    const id = currentMatchId;
    // Añadir mensaje de sistema de bienvenida al chat
    updateChat(id, prev => ({
      phase: 'chat',
      messages: [...prev.messages, {
        id: nextMsgId(),
        type: 'system',
        subtype: 'welcome',
        icon: '💬',
        text: `¡Bienvenidos al chat! Están en Nivel 1: solo texto. Intercambien mensajes para ganar XP y desbloquear el siguiente nivel.`,
        time: nowTime()
      }]
    }));
    showToast('💬 Chat desbloqueado (Nivel 1)', 2000);
  };

  const handleProposeLevelUp = () => {
    if (!currentChat) return;
    const { level, xp, hasAccepted } = currentChat;
    const nextLevel = LEVELS.find(l => l.id === level + 1);
    if (!nextLevel || xp < nextLevel.xpReq || hasAccepted) return;
    const id = currentMatchId;
    updateChat(id, { hasAccepted: true });
    showToast('📤 Propuesta enviada', 1500);
    
    setTimeout(() => {
      const newLevel = currentChat.level + 1;
      const newLevelData = LEVELS.find(l => l.id === newLevel);
      
      // Actualizar el chat con el nuevo nivel y el mensaje de sistema
      setChats(prev => {
        const cur = prev[id]; 
        if (!cur) return prev;
        return {
          ...prev, 
          [id]: {
            ...cur,
            level: newLevel,
            xp: Math.min(cur.xp + 25, 500),
            hasAccepted: false,
            messages: [...cur.messages, {
              id: nextMsgId(),
              type: 'system',
              subtype: 'levelup',
              icon: newLevelData?.icon || '🎉',
              text: `¡Subieron al Nivel ${newLevel}! ${newLevelData?.feature} desbloqueado. ${newLevelData?.desc}`,
              time: nowTime()
            }]
          }
        };
      });
      
      // Mostrar overlay épico
      setLevelUpOverlay({ level: newLevel, matchId: id });
      
      // Activar el pulso del botón correspondiente
      const featureKey = newLevel === 2 ? 'voice' : newLevel === 3 ? 'photo' : newLevel === 4 ? 'contact' : null;
      if (featureKey) {
        setJustUnlockedFeature(featureKey);
        setTimeout(() => setJustUnlockedFeature(null), 10000); // 10 segundos de pulso
      }
      
      // Asegurar que el usuario vea el chat con el mensaje
      setCurrentMatchId(id);
      setActiveTab('chat');
    }, 2000);
  };

  const handleSendMessage = (text) => {
    if (!currentMatchId) return;
    const id = currentMatchId;
    const now = nowTime();
    updateChat(id, prev => ({ messages: [...prev.messages, { id: nextMsgId(), text, from: 'me', time: now }], xp: Math.min(prev.xp + 5, 500) }));
    setTimeout(() => {
      const replies = ['¡Qué interesante! Cuéntame más.', 'Me encanta esa respuesta.', '¿En serio? ¡Qué genial!', 'Nunca había pensado en eso.', '¡Totalmente de acuerdo!'];
      updateChat(id, prev => ({ messages: [...prev.messages, { id: nextMsgId(), text: replies[Math.floor(Math.random() * replies.length)], from: 'them', time: nowTime() }] }));
    }, 1200);
  };

  const handleSendPoll = () => {
    if (!currentMatchId) return;
    const id = currentMatchId;
    const randomQ = THIS_OR_THAT_OPTIONS[Math.floor(Math.random() * THIS_OR_THAT_OPTIONS.length)];
    const pollId = nextMsgId();
    
    updateChat(id, prev => ({
      messages: [...prev.messages, { 
        id: pollId, type: 'poll', question: randomQ.q, optionA: randomQ.a, optionB: randomQ.b,
        votedBy: [], from: 'me', time: nowTime() 
      }]
    }));

    setTimeout(() => {
      updateChat(id, prev => {
        const msgs = prev.messages.map(m => {
          if (m.id === pollId) return { ...m, votedBy: [...m.votedBy, 'them'], matchVote: Math.random() > 0.5 ? 'A' : 'B' };
          return m;
        });
        const pollMsg = msgs.find(m => m.id === pollId);
        const isMatch = pollMsg.myVote === pollMsg.matchVote;
        const xpGain = (pollMsg.votedBy.includes('me') && isMatch) ? 25 : 15;
        
        return { ...prev, messages: msgs, xp: Math.min(prev.xp + xpGain, 500) };
      });
      showToast('✨ ¡Juego completado! +15 XP', 2000);
    }, 1500);
  };

  const handleVotePoll = (msgId, vote) => {
    if (!currentMatchId) return;
    const id = currentMatchId;
    
    updateChat(id, prev => {
      const msgs = prev.messages.map(m => {
        if (m.id === msgId && !m.votedBy.includes('me')) return { ...m, votedBy: [...m.votedBy, 'me'], myVote: vote };
        return m;
      });
      return { ...prev, messages: msgs };
    });

    setTimeout(() => {
      updateChat(id, prev => {
        const msgs = prev.messages.map(m => {
          if (m.id === msgId && !m.votedBy.includes('them')) {
            const matchVote = Math.random() > 0.5 ? 'A' : 'B';
            return { ...m, votedBy: [...m.votedBy, 'them'], matchVote };
          }
          return m;
        });
        const pollMsg = msgs.find(m => m.id === msgId);
        const isMatch = pollMsg.myVote === pollMsg.matchVote;
        const xpGain = isMatch ? 25 : 15;
        
        return { ...prev, messages: msgs, xp: Math.min(prev.xp + xpGain, 500) };
      });
      const finalMsg = chats[id]?.messages.find(m => m.id === msgId);
      const wasMatch = finalMsg?.myVote === finalMsg?.matchVote;
      showToast(wasMatch ? '🎉 ¡Coincidieron! +25 XP' : '✨ ¡Juego completado! +15 XP', 2000);
    }, 1000);
  };

  const handleAudio = () => {
    if (!currentMatchId) return;
    const id = currentMatchId;
    updateChat(id, prev => ({ messages: [...prev.messages, { id: nextMsgId(), text: 'Nota de voz (simulada)', from: 'me', time: nowTime(), isAudio: true }], xp: Math.min(prev.xp + 10, 500) }));
    setTimeout(() => updateChat(id, prev => ({ messages: [...prev.messages, { id: nextMsgId(), text: '¡Me encanta tu voz!', from: 'them', time: nowTime(), isAudio: true }] })), 1500);
  };

  const handlePhoto = () => {
    if (!currentMatchId) return;
    const id = currentMatchId;
    updateChat(id, prev => ({ messages: [...prev.messages, { id: nextMsgId(), text: 'Foto compartida (simulada)', from: 'me', time: nowTime(), isPhoto: true }], xp: Math.min(prev.xp + 10, 500) }));
    setTimeout(() => updateChat(id, prev => ({ messages: [...prev.messages, { id: nextMsgId(), text: '¡Qué bonita foto!', from: 'them', time: nowTime(), isPhoto: true }] })), 1500);
  };

  const handleShareContact = () => {
    if (!currentChat) return;
    if (!isPremium) { showToast('🔒 Función Premium. Actívala en tu perfil.', 2000); return; }
    const id = currentMatchId;
    updateChat(id, prev => ({ messages: [...prev.messages, { id: nextMsgId(), text: 'Has compartido tu número de teléfono con ' + prev.match.name, from: 'me', time: nowTime(), isContact: true }] }));
    showToast('📞 Número compartido', 2000);
  };

  const handleTogglePremium = () => {
    setIsPremium(prev => {
      const next = !prev;
      showToast(next ? '⭐ Premium activado (demo)' : '⭐ Premium desactivado', 1500);
      return next;
    });
  };

  if (!email) return (<div className="app-shell"><div className="phone"><LoginScreen onLogin={handleLogin} /></div></div>);

  const tabs = [
    { id: 'swipe', icon: '♥', label: 'Descubrir' },
    { id: 'progress', icon: '⚡', label: 'Progreso' },
    { id: 'chat', icon: '💬', label: 'Chats' },
    { id: 'profile', icon: '👤', label: 'Perfil' },
  ];

  const renderChatContent = () => {
    if (!matchIds.length) return (<div className="empty-state"><div className="icon">💬</div><h2>Sin conversaciones</h2><p>Consigue un match en Descubrir.</p></div>);
    if (!currentChat) return (<div className="empty-state"><div className="icon">💬</div><h2>Elige una conversación</h2><p>Toca un avatar para abrir el chat.</p></div>);
    if (currentChat.phase === 'questions') return <QuestionsScreen match={currentChat.match} onComplete={handleQuestionsComplete} onSkip={handleQuestionsSkip} />;
    if (currentChat.phase === 'reveal') return <RevealScreen match={currentChat.match} myAnswers={currentChat.myAnswers} theirAnswers={currentChat.theirAnswers} onContinue={handleRevealContinue} />;
    return (
      <ChatScreen
        match={currentChat.match} level={currentChat.level} messages={currentChat.messages}
        onSend={handleSendMessage} onAudio={handleAudio} onPhoto={handlePhoto} onShareContact={handleShareContact}
        isPremium={isPremium} onSendPoll={handleSendPoll} onVotePoll={handleVotePoll}
        justUnlockedFeature={justUnlockedFeature}
      />
    );
  };

  const activeLevel = currentChat ? currentChat.level : 1;

  return (
    <div className="app-shell">
      <div className="phone">
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
          {activeTab === 'swipe' && <SwipeScreen onMatch={handleMatch} index={swipeIndex} onIndexChange={setSwipeIndex} />}
          {activeTab === 'progress' && <ProgressScreen match={currentChat ? currentChat.match : null} level={activeLevel} xp={currentChat ? currentChat.xp : 0} hasAccepted={currentChat ? currentChat.hasAccepted : false} onProposeLevelUp={handleProposeLevelUp} isPremium={isPremium} />}
          {activeTab === 'chat' && (
            <>
              {matchIds.length > 1 && (
                <div className="match-strip">
                  {matchIds.map(id => {
                    const c = chats[id];
                    return (<button key={id} className={`match-pill ${id === currentMatchId ? 'active' : ''}`} style={{ background: c.match.gradient }} aria-label={`Abrir chat con ${c.match.name}`} onClick={() => setCurrentMatchId(id)}>{c.match.name.charAt(0)}</button>);
                  })}
                </div>
              )}
              {renderChatContent()}
            </>
          )}
          {activeTab === 'profile' && <ProfileScreen email={email} matchCount={matchIds.length} level={activeLevel} onLogout={handleLogout} isPremium={isPremium} onTogglePremium={handleTogglePremium} />}
        </div>
        <div className="bottom-nav">
          {tabs.map(tab => (
            <button key={tab.id} className={`nav-btn ${activeTab === tab.id ? 'active' : ''}`} aria-label={tab.label} onClick={() => setActiveTab(tab.id)}>
              <span className="nav-icon">{tab.icon}</span><span className="nav-label">{tab.label}</span>
            </button>
          ))}
        </div>
        {toast && <div className="toast">{toast}</div>}
        {levelUpOverlay && (
          <LevelUpOverlay
            level={levelUpOverlay.level}
            onClose={() => setLevelUpOverlay(null)}
          />
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
