<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// --------------------------------------------------------------
// 🔑 CONFIGURACIÓN DE SUPABASE
// --------------------------------------------------------------
const SUPABASE_URL = 'https://czgbtxyyuspbrnslrmbs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qZrp5Nwdbua8ADkVNYZqoQ_FALolSQx';

const SUPABASE_SDK_LOADED = typeof window.supabase !== 'undefined';
const supabase = SUPABASE_SDK_LOADED
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

// --------------------------------------------------------------
// DATOS MOCK (perfiles a descubrir)
// --------------------------------------------------------------
const MOCK_USERS = [
  { id: '1', name: 'Lucía', age: 25, city: 'Madrid', bio: 'Amante del cine indie y los gatos.', gradient: 'linear-gradient(135deg,#fb7185,#fdba74)' },
  { id: '2', name: 'Carlos', age: 28, city: 'Barcelona', bio: 'Chef y viajero. Busco a mi compañera de aventuras.', gradient: 'linear-gradient(135deg,#38bdf8,#67e8f9)' },
  { id: '3', name: 'Marta', age: 23, city: 'Valencia', bio: 'Estudiante de arte. Me encanta el rock y el café.', gradient: 'linear-gradient(135deg,#a78bfa,#f0abfc)' },
  { id: '4', name: 'Jorge', age: 30, city: 'Sevilla', bio: 'Ingeniero de día, DJ de noche.', gradient: 'linear-gradient(135deg,#34d399,#5eead4)' },
  { id: '5', name: 'Elena', age: 26, city: 'Bilbao', bio: 'Surfista y diseñadora gráfica. Busco buena conversación.', gradient: 'linear-gradient(135deg,#fbbf24,#fde047)' },
];

const LEVELS = [
  { id: 1, name: 'Texto', xpReq: 0 },
  { id: 2, name: 'Voz', xpReq: 100 },
  { id: 3, name: 'Fotos', xpReq: 250 },
];

const QUESTIONS = [
  "¿Cuál es el viaje que más te ha marcado?",
  "¿Qué libro o película te hizo llorar?",
  "Si pudieras cenar con alguien histórico, ¿quién sería?",
  "¿Cuál es tu mayor miedo?",
  "¿Qué te hace sentir más vivo/a?"
];

// --------------------------------------------------------------
// COMPONENTES
// --------------------------------------------------------------
function calculateAge(dobString) {
  if (!dobString) return null;
  const dob = new Date(dobString);
  if (isNaN(dob.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
  return age;
}

// --------------------------------------------------------------
// REGISTER (con Supabase)
// --------------------------------------------------------------
function RegisterScreen({ onRegister, onBackToLogin }) {
  const [form, setForm] = useState({
    nombre: '', apellido: '', alias: '', fechaNacimiento: '', genero: '',
    interesadoEn: '', ciudad: '', bio: '', email: '', password: '', confirmPassword: '',
    aceptaTerminos: false,
  });
  const [errors, setErrors] = useState({});
  const [loading, setLoading] = useState(false);

  const setField = (key, value) => setForm(prev => ({ ...prev, [key]: value }));

  const validate = () => {
    const errs = {};
    if (!form.nombre.trim()) errs.nombre = 'Ingresa tu nombre';
    if (!form.apellido.trim()) errs.apellido = 'Ingresa tu apellido';
    if (!form.alias.trim()) errs.alias = 'Elige un alias público';
    if (!form.fechaNacimiento) errs.fechaNacimiento = 'Ingresa tu fecha de nacimiento';
    else {
      const age = calculateAge(form.fechaNacimiento);
      if (age === null) errs.fechaNacimiento = 'Fecha inválida';
      else if (age < 18) errs.fechaNacimiento = 'Debes ser mayor de 18 años';
    }
    if (!form.genero) errs.genero = 'Selecciona tu género';
    if (!form.interesadoEn) errs.interesadoEn = 'Selecciona qué te interesa';
    if (!form.ciudad.trim()) errs.ciudad = 'Ingresa tu ciudad';
    if (!form.email.trim()) errs.email = 'Ingresa tu email';
    if (!form.password) errs.password = 'Ingresa una contraseña';
    else if (form.password.length < 6) errs.password = 'Mínimo 6 caracteres';
    if (form.confirmPassword !== form.password) errs.confirmPassword = 'Las contraseñas no coinciden';
    if (!form.aceptaTerminos) errs.aceptaTerminos = 'Debes aceptar los términos y confirmar que eres mayor de edad';
    return errs;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    const errs = validate();
    setErrors(errs);
    if (Object.keys(errs).length > 0) return;

    if (!SUPABASE_SDK_LOADED) {
      alert('El SDK de Supabase no cargó en este entorno. Vuelve a la pantalla anterior y usa "Entrar en modo demo", o abre este archivo fuera de Claude para registrarte de verdad.');
      return;
    }

    setLoading(true);
    try {
      const { data: authData, error: authError } = await supabase.auth.signUp({
        email: form.email,
        password: form.password,
      });

      if (authError) throw authError;

      const userId = authData.user.id;

      const { error: profileError } = await supabase.from('profiles').insert({
        id: userId,
        alias: form.alias,
        nombre: form.nombre,
        apellido: form.apellido,
        fecha_nacimiento: form.fechaNacimiento,
        genero: form.genero,
        interesado_en: form.interesadoEn,
        ciudad: form.ciudad,
        bio: form.bio,
      });

      if (profileError) throw profileError;

      const { error: signInError } = await supabase.auth.signInWithPassword({
        email: form.email,
        password: form.password,
      });

      if (signInError) throw signInError;

      onRegister(form.email);
    } catch (error) {
      alert('Error al registrarte: ' + error.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="login-screen">
      <div className="login-inner">
        <h1 className="login-title" style={{ fontSize: 32 }}>Crear cuenta</h1>

// --------------------------------------------------------------
// SWIPE
// --------------------------------------------------------------
function SwipeScreen({ onMatch, users }) {
  const [currentIndex, setCurrentIndex] = useState(0);
  const [isDragging, setIsDragging] = useState(false);
  const [startX, setStartX] = useState(0);
  const [offsetX, setOffsetX] = useState(0);
  const [lastResult, setLastResult] = useState(null);

  const currentUserData = users[currentIndex];

  const handleSwipe = (direction) => {
    if (!currentUserData) return;
    if (direction === 'right') {
      const isMatch = Math.random() > 0.4;
      if (isMatch) {
        onMatch(currentUserData);
        setLastResult({ name: currentUserData.name });
      } else {
        setLastResult(null);
      }
    } else {
      setLastResult(null);
    }
    setCurrentIndex(prev => prev + 1);
    setOffsetX(0);
  };

  const startDrag = (x) => { setIsDragging(true); setStartX(x); };
  const moveDrag = (x) => { if (isDragging) setOffsetX(x - startX); };
  const endDrag = () => {
    setIsDragging(false);
    if (offsetX > 80) handleSwipe('right');
    else if (offsetX < -80) handleSwipe('left');
    else setOffsetX(0);
  };

  if (currentIndex >= users.length) {
    return (
      <div className="empty-state">
        <div className="icon">👥</div>
        <h2>No hay más perfiles</h2>
        <p>Vuelve más tarde o amplía tu radio de búsqueda.</p>
        <button className="btn-reload" onClick={() => { setCurrentIndex(0); setLastResult(null); }}>Ver perfiles de nuevo</button>
      </div>
    );
  }

  return (
    <div className="swipe-screen">
      <div className="swipe-header">
        <h2>Descubrir</h2>
        <span className="pill">{users.length - currentIndex} perfiles</span>
      </div>
      {lastResult && <div className="match-banner">💖 ¡Match con {lastResult.name}! Responde preguntas para conectar.</div>}
      <div className="swipe-area">
        <div
          className="swipe-card"
          style={{ transform: `translateX(${offsetX}px) rotate(${offsetX * 0.05}deg)`, transition: isDragging ? 'none' : 'transform 0.3s' }}
          onTouchStart={e => startDrag(e.touches[0].clientX)}
          onTouchMove={e => moveDrag(e.touches[0].clientX)}
          onTouchEnd={endDrag}
          onMouseDown={e => startDrag(e.clientX)}
          onMouseMove={e => moveDrag(e.clientX)}
          onMouseUp={endDrag}
          onMouseLeave={() => isDragging && endDrag()}
        >
          <div className="avatar-fill" style={{ background: currentUserData.gradient || 'linear-gradient(135deg,#fb7185,#fdba74)' }}>
            {currentUserData.name.charAt(0)}
          </div>
          <div className="card-info">
            <h3>{currentUserData.name}, {currentUserData.age}</h3>
            <p className="city">{currentUserData.city}</p>
            <p className="bio">{currentUserData.bio}</p>
          </div>
        </div>
        <div className="swipe-actions">
          <button className="round-btn no" onClick={() => handleSwipe('left')}>✕</button>
          <button className="round-btn yes" onClick={() => handleSwipe('right')}>♥</button>
        </div>
      </div>
    </div>
  );
}

// --------------------------------------------------------------
// QUESTIONS
// --------------------------------------------------------------
function QuestionsScreen({ match, onComplete, onCancel }) {
  const [answers, setAnswers] = useState([]);
  const [currentIdx, setCurrentIdx] = useState(0);
  const [inputValue, setInputValue] = useState('');
  const inputRef = useRef(null);

  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, [currentIdx]);

  const handleNext = () => {
    const trimmed = inputValue.trim();
    if (!trimmed) return;
    const newAnswers = [...answers, trimmed];
    setAnswers(newAnswers);
    setInputValue('');
    if (currentIdx < QUESTIONS.length - 1) {
      setCurrentIdx(currentIdx + 1);
    } else {
      onComplete(newAnswers);
    }
  };

  const progress = ((answers.length) / QUESTIONS.length) * 100;

  return (
    <div className="questions-screen">
      <div className="questions-header">
        <h2>Conoce a {match.name}</h2>
        <button onClick={onCancel}>Saltar</button>
      </div>
      <div className="progress-bar"><div className="progress-bar-fill" style={{ width: `${progress}%` }} /></div>
      <div className="q-card">
        <div className="q-number">Pregunta {currentIdx + 1} de {QUESTIONS.length}</div>
        <div className="q-text">{QUESTIONS[currentIdx]}</div>
        <input
          ref={inputRef}
          type="text"
          placeholder="Escribe tu respuesta..."
          value={inputValue}
          onChange={e => setInputValue(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && handleNext()}
        />
        <button className="btn-next" onClick={handleNext}>
          {currentIdx < QUESTIONS.length - 1 ? 'Siguiente →' : 'Completar →'}
        </button>
      </div>
    </div>
  );
}

// --------------------------------------------------------------
// PROGRESS
// --------------------------------------------------------------
function ProgressScreen({ match, level, xp, hasAccepted, onProposeLevelUp, isPremium }) {
  const xpToNext = () => {
    const next = LEVELS.find(l => l.id === level + 1);
    return next ? next.xpReq : xp;
  };

  const progress = () => {
    const cur = LEVELS.find(l => l.id === level);
    const next = LEVELS.find(l => l.id === level + 1);
    if (!next) return 100;
    const inLevel = xp - (cur ? cur.xpReq : 0);
    const needed = next.xpReq - (cur ? cur.xpReq : 0);
    return Math.min((inLevel / needed) * 100, 100);
  };

  const allLevels = [...LEVELS, { id: 4, name: 'Teléfono', xpReq: 500 }];

  if (!match) {
    return (
      <div className="empty-state">
        <div className="icon">⚡</div>
        <h2>Todavía no tienes un match</h2>
        <p>Desliza a la derecha en Descubrir para conseguir tu primer match.</p>
      </div>
    );
  }

  return (
    <div className="progress-screen">
      <div className="progress-header">
        <h2>Mi progreso</h2>
        <div className="match-chip">
          <span>⚡</span>
          <span>Match: {match.name}</span>
        </div>
      </div>

      <div className="xp-card">
        <div className="xp-row">
          <span>Experiencia (XP)</span>
          <span>{xp} / {level >= 4 ? 'MAX' : xpToNext()}</span>
        </div>
        <div className="xp-track">
          <div className="xp-fill" style={{ width: `${level >= 4 ? 100 : progress()}%` }} />
        </div>

        <div className="levels-row">
          <div className="levels-track">
            <div className="levels-track-fill" style={{ width: `${((level - 1) / (allLevels.length - 1)) * 100}%` }} />
          </div>
          {allLevels.map(lvl => {
            const unlocked = level >= lvl.id;
            const isCurrent = level === lvl.id;
            const isLockedPremium = lvl.id === 4 && !isPremium;
            return (
              <div key={lvl.id} className={`level-node ${unlocked ? 'unlocked' : ''}`}>
                <div className={`level-circle ${unlocked ? 'unlocked' : ''} ${isCurrent ? 'current' : ''}`}>
                  {isLockedPremium ? '⭐' : unlocked ? '✓' : '🔒'}
                </div>
                <span>{lvl.name}{isLockedPremium && ' (Premium)'}</span>
              </div>
            );
          })}
        </div>
      </div>

      {level < 4 ? (
        <>
          <button
            className="btn-levelup"
            disabled={hasAccepted}
            onClick={onProposeLevelUp}
          >
            {hasAccepted ? '⏳ Esperando confirmación...' : `⬆️ Subir a Nivel ${level + 1}`}
          </button>
          <div className="hint-box">
            {hasAccepted ? (
              <span className="accepted">★ Aceptaste. Esperando a {match.name}.</span>
            ) : (
              <span>📌 Ambos deben aceptar para subir al siguiente nivel.</span>
            )}
          </div>
        </>
      ) : (
        <div className="hint-box" style={{ color: 'var(--emerald)', borderColor: 'rgba(52,211,153,.4)' }}>
          🎉 ¡Nivel máximo alcanzado! {isPremium ? 'Puedes compartir tu teléfono.' : 'Activa Premium para compartir tu teléfono.'}
        </div>
      )}
    </div>
  );
}

function App() {
  const [email, setEmail] = useState(null);
  const [activeTab, setActiveTab] = useState('swipe');
  const [matches, setMatches] = useState([]);
  const [currentMatch, setCurrentMatch] = useState(null);
  const [level, setLevel] = useState(1);
  const [xp, setXp] = useState(45);
  const [hasAccepted, setHasAccepted] = useState(false);
  const [messages, setMessages] = useState([]);
  const [toast, setToast] = useState(null);
  const [isPremium, setIsPremium] = useState(false);
  const [phase, setPhase] = useState(null);
  const [myAnswers, setMyAnswers] = useState([]);
  const [theirAnswers, setTheirAnswers] = useState([]);
  const [users, setUsers] = useState(MOCK_USERS);

  const showToast = (msg, duration = 2200) => {
    setToast(msg);
    setTimeout(() => setToast(null), duration);
  };

  const handleLogin = (mail) => setEmail(mail);

  const handleLogout = () => {
    setEmail(null);
    setActiveTab('swipe');
    setMatches([]);
    setCurrentMatch(null);
    setLevel(1);
    setXp(45);
    setHasAccepted(false);
    setMessages([]);
    setPhase(null);
    setMyAnswers([]);
    setTheirAnswers([]);
    setIsPremium(false);
  };

  const handleMatch = (user) => {
    setMatches(prev => [...prev, user]);
    setCurrentMatch(user);
    setLevel(1);
    setXp(45);
    setHasAccepted(false);
    setMessages([]);
    setPhase('questions');
    setMyAnswers([]);
    setTheirAnswers([]);
    setActiveTab('chat');
  };

  const handleQuestionsComplete = (answers) => {
    setMyAnswers(answers);
    const mockTheir = [
      'Un viaje a la Patagonia',
      'La película "La vida es bella"',
      'A Frida Kahlo',
      'A la oscuridad',
      'La música en vivo'
    ];
    setTheirAnswers(mockTheir);
    setPhase('reveal');
    showToast('✨ Respuestas reveladas', 2000);
  };

  const handleRevealContinue = () => {
    setPhase('chat');
    showToast('💬 Chat desbloqueado (Nivel 1)', 2000);
  };

  const handleProposeLevelUp = () => {
    if (level >= 4 || hasAccepted) return;
    setHasAccepted(true);
    showToast('📤 Propuesta enviada', 1500);
    setTimeout(() => {
      const nextLevel = level + 1;
      setLevel(nextLevel);
      setXp(prev => Math.min(prev + 50, 500));
      setHasAccepted(false);
      showToast(`🎉 ¡Subieron a Nivel ${nextLevel}!`, 2500);
    }, 2000);
  };

  const handleSendMessage = (text) => {
    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    setMessages(prev => [...prev, { id: Date.now(), text, from: 'me', time: now }]);
    setXp(prev => Math.min(prev + 5, 500));
    setTimeout(() => {
      const replies = [
        '¡Qué interesante! Cuéntame más.',
        'Me encanta esa respuesta.',
        '¿En serio? ¡Qué genial!',
        'Nunca había pensado en eso.',
        '¡Totalmente de acuerdo!'
      ];
      const randomReply = replies[Math.floor(Math.random() * replies.length)];
      setMessages(prev => [...prev, { id: Date.now() + 1, text: randomReply, from: 'them', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]);
    }, 1200);
  };

  const handleAudio = () => {
    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    setMessages(prev => [...prev, { id: Date.now(), text: 'Nota de voz (simulada)', from: 'me', time: now, isAudio: true }]);
    setXp(prev => Math.min(prev + 10, 500));
    setTimeout(() => {
      setMessages(prev => [...prev, { id: Date.now() + 1, text: '¡Me encanta tu voz!', from: 'them', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), isAudio: true }]);
    }, 1500);
  };

  const handlePhoto = () => {
    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    setMessages(prev => [...prev, { id: Date.now(), text: 'Foto compartida (simulada)', from: 'me', time: now, isPhoto: true }]);
    setXp(prev => Math.min(prev + 10, 500));
    setTimeout(() => {
      setMessages(prev => [...prev, { id: Date.now() + 1, text: '¡Qué bonita foto!', from: 'them', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), isPhoto: true }]);
    }, 1500);
  };

  const handleShareContact = () => {
    if (!isPremium) {
      showToast('🔒 Función Premium. Actívala en tu perfil.', 2000);
      return;
    }
    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    setMessages(prev => [...prev, { id: Date.now(), text: 'Has compartido tu número de teléfono con ' + currentMatch.name, from: 'me', time: now, isContact: true }]);
    showToast('📞 Número compartido', 2000);
  };

  const handleTogglePremium = () => {
    setIsPremium(prev => !prev);
    showToast(isPremium ? '⭐ Premium desactivado' : '⭐ Premium activado (demo)', 1500);
  };

  if (!email) {
    return (
      <div className="app-shell">
        <div className="phone">
          <LoginScreen onLogin={handleLogin} />
        </div>
      </div>
    );
  }

  const tabs = [
    { id: 'swipe', icon: '♥', label: 'Descubrir' },
    { id: 'progress', icon: '⚡', label: 'Progreso' },
    { id: 'chat', icon: '💬', label: 'Chats' },
    { id: 'profile', icon: '👤', label: 'Perfil' },
  ];

  const renderChatContent = () => {
    if (!currentMatch) {
      return (
        <div className="empty-state">
          <div className="icon">💬</div>
          <h2>Sin conversaciones</h2>
          <p>Consigue un match en Descubrir.</p>
        </div>
      );
    }
    if (phase === 'questions') {
      return (
        <QuestionsScreen
          match={currentMatch}
          onComplete={handleQuestionsComplete}
          onCancel={() => { setPhase('chat'); showToast('Preguntas saltadas', 1500); }}
        />
      );
    }
    if (phase === 'reveal') {
      return (
        <RevealScreen
          match={currentMatch}
          myAnswers={myAnswers}
          theirAnswers={theirAnswers}
          onContinue={handleRevealContinue}
        />
      );
    }
    return (
      <ChatScreen
        match={currentMatch}
        level={level}
        messages={messages}
        onSend={handleSendMessage}
        onAudio={handleAudio}
        onPhoto={handlePhoto}
        onShareContact={handleShareContact}
        isPremium={isPremium}
      />
    );
  };

  return (
    <div className="app-shell">
      <div className="phone">
        <div style={{ flex: 1, overflow: 'hidden' }}>
          {activeTab === 'swipe' && <SwipeScreen onMatch={handleMatch} users={users} />}
          {activeTab === 'progress' && (
            <ProgressScreen
              match={currentMatch}
              level={level}
              xp={xp}
              hasAccepted={hasAccepted}
              onProposeLevelUp={handleProposeLevelUp}
              isPremium={isPremium}
            />
          )}
          {activeTab === 'chat' && renderChatContent()}
          {activeTab === 'profile' && (
            <ProfileScreen
              email={email}
              matchCount={matches.length}
              level={level}
              onLogout={handleLogout}
              isPremium={isPremium}
              onTogglePremium={handleTogglePremium}
            />
          )}
        </div>
        <div className="bottom-nav">
          {tabs.map(tab => (
            <button key={tab.id} className={`nav-btn ${activeTab === tab.id ? 'active' : ''}`} onClick={() => setActiveTab(tab.id)}>
              <span className="nav-icon">{tab.icon}</span>
              <span className="nav-label">{tab.label}</span>
            </button>
          ))}
        </div>
        {toast && <div className="toast">{toast}</div>}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
